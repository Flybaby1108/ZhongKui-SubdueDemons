<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Vacuum Cleaner Master - 关卡编辑器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 10px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            align-items: center;
        }

        /* ── Tab Bar ── */
        .tab-bar {
            display: flex;
            gap: 0;
            width: 98vw;
            max-width: 1920px;
            border-bottom: 3px solid #007acc;
        }
        .tab-btn {
            padding: 10px 28px;
            background: #2d2d2d;
            color: #aaa;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid transparent;
            border-bottom: none;
            margin-bottom: -3px;
            transition: background 0.15s, color 0.15s;
        }
        .tab-btn:hover {
            background: #3a3a3a;
            color: #ddd;
        }
        .tab-btn.active {
            background: #1e1e1e;
            color: #fff;
            border-color: #007acc;
            border-bottom-color: #1e1e1e;
        }
        .tab-btn .stage-badge {
            display: inline-block;
            background: #007acc;
            color: #fff;
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: normal;
        }
        .tab-btn.active .stage-badge {
            background: #005fa3;
        }

        /* ── Grid ── */
        .grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(192, minmax(0, 1fr));
            grid-template-rows: repeat(108, minmax(0, 1fr));
            gap: 0;
            background-color: #808080;
            background-size: 100% 100%;
            border: none;
            user-select: none;
            box-sizing: border-box;
            width: 98vw;
            height: 55.125vw;
            max-width: 1920px;
            max-height: 1080px;
        }
        .cell {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0);
            font-size: 0px;
            transition: opacity 0.2s;
        }
        .cell.has-label::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black, -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }
        .grid.transparent-cells .cell {
            opacity: 0.2;
        }
        .cell:hover {
            opacity: 0.8;
        }
        .platform-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
        .platform-object {
            position: absolute;
            background-size: 100% 100%;
            transform-origin: center center;
            outline: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.75);
            pointer-events: none;
        }
        .platform-object.inactive {
            outline-color: rgba(255, 255, 255, 0.25);
            box-shadow: none;
            opacity: 0.75;
        }
        .platform-move-range {
            position: absolute;
            height: 2px;
            background: rgba(126, 200, 227, 0.85);
            transform: translateY(-50%);
        }
        .platform-move-range.vertical {
            width: 2px;
            height: auto;
            transform: translateX(-50%);
        }
        .platform-collision-cell {
            position: absolute;
            background: rgba(255, 64, 64, 0.5);
            outline: 1px solid rgba(255,255,255,0.55);
            box-sizing: border-box;
        }
        .platform-panel {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: #252526;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .platform-panel.visible {
            display: flex;
        }
        .platform-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .platform-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #bbb;
        }
        .platform-row input {
            width: 82px;
            background: #1e1e1e;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px;
            box-sizing: border-box;
        }
        .platform-mode.active {
            background: #0b6fa4;
        }

        /* ── Sidebar / Tools ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .tool-group {
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: center;
        }
        .tool {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.1s;
        }
        .tool:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }
        .tool.selected {
            border-color: #ffffff;
            box-shadow: 0 0 0 2px #007acc, 0 0 12px rgba(0, 122, 204, 0.6);
        }
        .tool span {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            font-weight: bold;
        }
        .tool-color {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: 1px solid #000;
        }

        /* ── IO Section ── */
        .io-section {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background: #005f9e;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .level-hint {
            font-size: 13px;
            color: #888;
            padding: 6px 12px;
            background: #2a2a2a;
            border-left: 3px solid #007acc;
            border-radius: 3px;
        }
        .level-hint b { color: #7ec8e3; }
    </style>
</head>

<body>
<div class="main-container">

    <!-- Tab Bar -->
    <div class="tab-bar" id="tab-bar">
        <button class="tab-btn active" data-stage="1">
            Chapter1 <span class="stage-badge">Stage 1</span>
        </button>
        <button class="tab-btn" data-stage="2">
            Chapter2 <span class="stage-badge">Stage 2</span>
        </button>
        <button class="tab-btn" data-stage="3">
            ChapterBoss <span class="stage-badge">Stage 3</span>
        </button>
    </div>

    <!-- Grid -->
    <div class="grid" id="grid">
        <div class="platform-layer" id="platform-layer"></div>
    </div>

    <!-- Level hint -->
    <div class="level-hint" id="level-hint">
        当前编辑：<b id="level-hint-name">Chapter1</b>（Stage <b id="level-hint-stage">1</b>）
        &nbsp;·&nbsp; 背景图：<b id="level-hint-bg">Chapter1_BG_a.png</b>
        &nbsp;·&nbsp; <kbd>V</kbd> 切换透明度
    </div>

    <!-- Tools -->
    <div class="sidebar">
        <div class="tool-group" id="tools">
            <div class="tool selected" data-char=" ">
                <div class="tool-color" style="background: rgba(0,0,0,0); border: 1px dashed #555;"></div>
                <span>橡皮擦 (空格)</span>
            </div>
            <div class="tool" data-char="#">
                <div class="tool-color" style="background: rgba(255, 255, 0, 1);"></div>
                <span>地面 (#)</span>
            </div>
            <div class="tool" data-char="=">
                <div class="tool-color" style="background: rgba(0, 255, 0, 1);"></div>
                <span>平台 (=)</span>
            </div>
            <div class="tool" data-char="X">
                <div class="tool-color" style="background: rgba(128, 0, 128, 1);"></div>
                <span>禁区 (X)</span>
            </div>
            <div class="tool" data-char="P">
                <div class="tool-color" style="background: rgba(30, 144, 255, 1);"></div>
                <span>主角 (P)</span>
            </div>
            <div class="tool" data-char="M">
                <div class="tool-color" style="background: rgba(255, 69, 0, 1);"></div>
                <span>流星锤 (M)</span>
            </div>
            <div class="tool" data-char="R">
                <div class="tool-color" style="background: rgba(255, 0, 128, 1);"></div>
                <span>红衣女鬼 (R)</span>
            </div>
            <div class="tool" data-char="D">
                <div class="tool-color" style="background: rgba(180, 0, 0, 1);"></div>
                <span>红魔王 (D)</span>
            </div>
            <div class="tool" data-char="Z">
                <div class="tool-color" style="background: rgba(120, 170, 80, 1);"></div>
                <span>宫廷僵尸 (Z)</span>
            </div>
            <div class="tool" data-char="B">
                <div class="tool-color" style="background: rgba(80, 0, 0, 1);"></div>
                <span>Boss (B)</span>
            </div>
            <div class="tool" data-char="r">
                <div class="tool-color" style="background: rgba(255, 215, 0, 1);"></div>
                <span>元宝 (r)</span>
            </div>
        </div>
        <div class="platform-panel" id="platform-panel">
            <div class="platform-row">
                <button id="btn-platform-select" class="platform-mode active">选择平台</button>
                <button id="btn-platform-collision" class="platform-mode">绘制平台碰撞</button>
                <button id="btn-add-platform" style="background:#2d7a2d;">新增浮动平台</button>
                <button id="btn-delete-platform" style="background:#a93226;">删除选中平台</button>
            </div>
            <div class="platform-row">
                <label>X <input id="platform-x" type="number" step="1"></label>
                <label>Y <input id="platform-y" type="number" step="1"></label>
                <label>缩放 <input id="platform-scale" type="number" step="0.05" min="0.05"></label>
                <label>左移范围 <input id="platform-left" type="number" step="1" min="0"></label>
                <label>右移范围 <input id="platform-right" type="number" step="1" min="0"></label>
                <label>上移范围 <input id="platform-up" type="number" step="1" min="0"></label>
                <label>下移范围 <input id="platform-down" type="number" step="1" min="0"></label>
                <label>速度 <input id="platform-speed" type="number" step="1" min="0"></label>
            </div>
        </div>
    </div>

    <!-- IO Section -->
    <div class="io-section" style="width: 95vw; max-width: 1920px; background: #252526; padding: 20px; border-radius: 8px; box-sizing: border-box;">
        <div>
            <h1 style="margin-top:0;">Vacuum Cleaner Master - 关卡编辑器</h1>
            <p style="color:#aaa; margin:0 0 12px;">
                1. 切换上方 Tab 选择关卡。&nbsp;
                2. 拖拽绘制地形/实体。&nbsp;
                3. <b>导出</b> 将生成包含 <code>Chapter1</code>、<code>Chapter2</code> 和 <code>ChapterBoss</code> 的完整 <code>level_data.gd</code>，各关卡数据互不影响。
            </p>
        </div>
        <div class="button-group">
            <button id="btn-export">⬇️ 导出完整 level_data.gd（含所有关卡）</button>
            <button id="btn-import">⬆️ 导入（当前 Tab 或完整文件均可）</button>
            <button id="btn-import-all" style="background:#2d7a2d;">⬆️ 从完整文件一键导入所有关卡</button>
            <button id="btn-clear" style="background: #a93226;">🗑 清空当前关卡</button>
            <button id="btn-clear-all" style="background: #7b241c;">🗑 一键清空所有关卡</button>
        </div>
        <input type="file" id="file-picker" accept=".gd,.txt,text/plain" style="display:none;">
        <textarea id="io-text" placeholder='支持两种导入方式：
1. 粘贴完整 level_data.gd 后点击「一键导入所有关卡」，自动分发到对应 Tab。
2. 只粘贴当前关卡的行（带双引号），点击「导入」只更新当前 Tab。

导出后直接替换整个 level_data.gd 文件内容即可。'></textarea>
    </div>

</div>
<script>
    const COLS = 192;
    const ROWS = 108;

    // ── Level Definitions ──────────────────────────────────────────────────────
    // Each entry: name, stageKey (int used in GDScript LEVELS dict), bgImage
    // mapData is allocated separately to avoid sharing references between levels.
    const LEVEL_DEFS = {
        1: {
            name:    'Chapter1',
            bgImage: 'assets/sprites/Chapter1/Chapter1_BG_a.png',
        },
        2: {
            name:    'Chapter2',
            bgImage: 'assets/sprites/Chapter2/Chapter2_BG_a.png',
            bgVersion: '20260602',
        },
        3: {
            name:    'ChapterBoss',
            bgImage: 'assets/sprites/ChapterBoss/ChapterBoss_BG_a.png',
        },
    };

    // Storage: one isolated 2-D array per stage. Never share references.
    const allMapData = {};
    for (const stageKey of Object.keys(LEVEL_DEFS)) {
        allMapData[stageKey] = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
    }
    const PLATFORM_CELL_SIZE = 10;
    const PLATFORM_TEXTURES = {
        'res://assets/sprites/Chapter2/Chapter2_Platform1_01.png': {
            editorUrl: 'assets/sprites/Chapter2/Chapter2_Platform1_01.png',
            width: 542,
            height: 326,
            collisionWidth: 542,
            collisionHeight: 254,
        },
        'res://assets/sprites/Chapter2/Chapter2_Platform1.png': {
            editorUrl: 'assets/sprites/Chapter2/Chapter2_Platform1.png',
            width: 542,
            height: 254,
        },
        'res://assets/sprites/Chapter2/Chapter2_Platform2.png': {
            editorUrl: 'assets/sprites/Chapter2/Chapter2_Platform2.png',
            width: 452,
            height: 316,
        },
        'res://assets/sprites/Chapter2/Chapter2_Platform2_01.png': {
            editorUrl: 'assets/sprites/Chapter2/Chapter2_Platform2_01.png',
            width: 452,
            height: 386,
            collisionWidth: 452,
            collisionHeight: 316,
        },
    };
    const DEFAULT_PLATFORM_TEXTURE_PATH = 'res://assets/sprites/Chapter2/Chapter2_Platform1_01.png';
    const allPlatformData = {};
    for (const stageKey of Object.keys(LEVEL_DEFS)) {
        allPlatformData[stageKey] = [];
    }

    function createDefaultPlatformCollision() {
        const cells = [];
        for (let y = 2; y <= 3; y++) {
            for (let x = 4; x <= 49; x++) cells.push({ x, y });
        }
        return cells;
    }

    function createDefaultPlatform() {
        return {
            texture_path: DEFAULT_PLATFORM_TEXTURE_PATH,
            x: 960,
            y: 430,
            scale_x: 1,
            scale_y: 1,
            move_left: 180,
            move_right: 180,
            move_up: 0,
            move_down: 0,
            speed: 80,
            collision_cells: createDefaultPlatformCollision(),
        };
    }

    function platformTextureFor(platform) {
        const path = platform && platform.texture_path ? platform.texture_path : DEFAULT_PLATFORM_TEXTURE_PATH;
        return PLATFORM_TEXTURES[path] || PLATFORM_TEXTURES[DEFAULT_PLATFORM_TEXTURE_PATH];
    }

    function platformCollisionWidth(texture) {
        return texture.collisionWidth || texture.width;
    }

    function platformCollisionHeight(texture) {
        return texture.collisionHeight || texture.height;
    }

    function normalizePlatform(platform) {
        if (!platform.texture_path) platform.texture_path = DEFAULT_PLATFORM_TEXTURE_PATH;
        if (!Number.isFinite(platform.move_left)) platform.move_left = 0;
        if (!Number.isFinite(platform.move_right)) platform.move_right = 0;
        if (!Number.isFinite(platform.move_up)) platform.move_up = 0;
        if (!Number.isFinite(platform.move_down)) platform.move_down = 0;
        if (!Number.isFinite(platform.speed)) platform.speed = 80;
        if (!Array.isArray(platform.collision_cells)) platform.collision_cells = createDefaultPlatformCollision();
        return platform;
    }

    // ── Shared Tool / Color State ──────────────────────────────────────────────
    const colorMap = {
        ' ': 'rgba(0,0,0,0)',
        '#': 'rgba(255, 255, 0, 1)',
        '=': 'rgba(0, 255, 0, 1)',
        'X': 'rgba(128, 0, 128, 1)',
        'P': 'rgba(30, 144, 255, 1)',
        'M': 'rgba(255, 69, 0, 1)',
        'R': 'rgba(255, 0, 128, 1)',
        'D': 'rgba(180, 0, 0, 1)',
        'Z': 'rgba(120, 170, 80, 1)',
        'B': 'rgba(80, 0, 0, 1)',
        'r': 'rgba(255, 215, 0, 1)',
    };
    const nameMap = {
        'P': '主角',
        'M': '流星锤',
        'R': '红衣女鬼',
        'D': '红魔王',
        'Z': '宫廷僵尸',
        'B': 'Boss',
        'r': '元宝',
    };
    const ENTITY_CHARS = new Set(Object.keys(nameMap));

    let currentChar  = ' ';
    let currentColor = colorMap[' '];
    let isMouseDown  = false;
    let platformMode = 'select';
    let selectedPlatformIndex = 0;
    let collisionPaintValue = true;

    // ── Active Tab State ───────────────────────────────────────────────────────
    let activeStage = 1;   // integer key into LEVEL_DEFS / allMapData

    function getMapData() { return allMapData[activeStage]; }
    function getPlatformData() { return allPlatformData[activeStage] || []; }

    // ── DOM Refs ───────────────────────────────────────────────────────────────
    const gridEl       = document.getElementById('grid');
    const tools        = document.querySelectorAll('.tool');
    const ioText       = document.getElementById('io-text');
    const tabBtns      = document.querySelectorAll('.tab-btn');
    const hintName     = document.getElementById('level-hint-name');
    const hintStage    = document.getElementById('level-hint-stage');
    const hintBg       = document.getElementById('level-hint-bg');
    const platformLayer = document.getElementById('platform-layer');
    const platformPanel = document.getElementById('platform-panel');
    const platformInputs = {
        x: document.getElementById('platform-x'),
        y: document.getElementById('platform-y'),
        scale: document.getElementById('platform-scale'),
        move_left: document.getElementById('platform-left'),
        move_right: document.getElementById('platform-right'),
        move_up: document.getElementById('platform-up'),
        move_down: document.getElementById('platform-down'),
        speed: document.getElementById('platform-speed'),
    };

    // ── Build Grid DOM (once) ──────────────────────────────────────────────────
    // We reuse the same DOM cells for all levels; only mapData + bg image swap.
    const cellEls = [];   // flat array indexed [y * COLS + x]

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.x = x;
            cell.dataset.y = y;
            cell.addEventListener('mousedown', () => { isMouseDown = true; handleCellMouseDown(x, y, cell); });
            cell.addEventListener('mouseover', () => { if (isMouseDown) handleCellMouseOver(x, y, cell); });
            gridEl.appendChild(cell);
            cellEls.push(cell);
        }
    }
    window.addEventListener('mouseup', () => { isMouseDown = false; });

    // ── Brush Cursor ───────────────────────────────────────────────────────────
    const brushCursor = document.createElement('div');
    brushCursor.style.cssText = 'position:absolute;border:2px solid white;pointer-events:none;display:none;box-sizing:border-box;z-index:100;';
    gridEl.appendChild(brushCursor);

    gridEl.addEventListener('mousemove', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        const rect     = cell.getBoundingClientRect();
        const gridRect = gridEl.getBoundingClientRect();
        const isEntity = ![ ' ', '#', '=', 'X' ].includes(currentChar);
        brushCursor.style.display = 'block';
        if (isEntity) {
            brushCursor.style.left   = (rect.left - gridRect.left - rect.width  * 2) + 'px';
            brushCursor.style.top    = (rect.top  - gridRect.top  - rect.height * 2) + 'px';
            brushCursor.style.width  = (rect.width  * 6) + 'px';
            brushCursor.style.height = (rect.height * 6) + 'px';
        } else {
            brushCursor.style.left   = (rect.left - gridRect.left) + 'px';
            brushCursor.style.top    = (rect.top  - gridRect.top)  + 'px';
            brushCursor.style.width  = rect.width  + 'px';
            brushCursor.style.height = rect.height + 'px';
        }
    });
    gridEl.addEventListener('mouseleave', () => { brushCursor.style.display = 'none'; });

    function isPlatformEditingActive() {
        return platformMode === 'collision';
    }

    // ── Tool Button Styles ─────────────────────────────────────────────────────
    function pickTextColor(rgbaStr) {
        const m = rgbaStr.match(/rgba?\(([^)]+)\)/);
        if (!m) return '#fff';
        const parts = m[1].split(',').map(s => parseFloat(s.trim()));
        const [r, g, b, a = 1] = parts;
        if (a < 0.1) return '#ccc';
        const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luma > 0.6 ? '#000' : '#fff';
    }
    tools.forEach(tool => {
        const ch    = tool.dataset.char;
        const color = colorMap[ch];
        if (ch === ' ') {
            tool.style.cssText += 'background:#2a2a2a;color:#ccc;border-style:dashed;border-color:#666;';
        } else if (color) {
            tool.style.background = color;
            tool.style.color      = pickTextColor(color);
        }
    });

    // ── Tool Selection ─────────────────────────────────────────────────────────
    tools.forEach(tool => {
        tool.addEventListener('click', () => {
            tools.forEach(t => t.classList.remove('selected'));
            tool.classList.add('selected');
            currentChar  = tool.dataset.char;
            currentColor = colorMap[currentChar];
            if (!isPlatformEditingActive()) {
                gridEl.style.cursor = ['#', '=', 'X'].includes(currentChar) ? 'none' : 'crosshair';
            }
        });
    });
    gridEl.style.cursor = 'crosshair';

    document.getElementById('btn-platform-select').addEventListener('click', () => setPlatformMode('select'));
    document.getElementById('btn-platform-collision').addEventListener('click', () => setPlatformMode('collision'));
    document.getElementById('btn-add-platform').addEventListener('click', () => {
        const platforms = getPlatformData();
        platforms.push(createDefaultPlatform());
        selectedPlatformIndex = platforms.length - 1;
        updatePlatformPanel();
        renderPlatforms();
    });
    document.getElementById('btn-delete-platform').addEventListener('click', () => {
        const platforms = getPlatformData();
        if (!selectedPlatform()) return;
        platforms.splice(selectedPlatformIndex, 1);
        selectedPlatformIndex = Math.max(0, Math.min(selectedPlatformIndex, platforms.length - 1));
        updatePlatformPanel();
        renderPlatforms();
    });
    for (const [key, input] of Object.entries(platformInputs)) {
        input.addEventListener('input', () => {
            const platform = selectedPlatform();
            if (!platform) return;
            const value = parseFloat(input.value);
            if (!Number.isFinite(value)) return;
            if (key === 'scale') {
                setPlatformScale(platform, value);
            } else {
                platform[key] = value;
            }
            renderPlatforms();
        });
    }

    // ── Keyboard Shortcuts ─────────────────────────────────────────────────────
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'v') gridEl.classList.toggle('transparent-cells');
        // Number keys 1,2 switch tabs quickly
        const n = parseInt(e.key);
        if (n >= 1 && n <= Object.keys(LEVEL_DEFS).length && !e.ctrlKey && !e.metaKey) {
            switchTab(n);
        }
    });

    // ── Tab Switching ──────────────────────────────────────────────────────────
    function switchTab(stageKey) {
        stageKey = parseInt(stageKey);
        if (!(stageKey in LEVEL_DEFS)) return;
        activeStage = stageKey;
        selectedPlatformIndex = 0;

        // Update tab button states
        tabBtns.forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.stage) === stageKey);
        });

        // Swap background image to match this level's foreground art
        const def = LEVEL_DEFS[stageKey];
        const bgUrl = def.bgVersion ? `${def.bgImage}?v=${def.bgVersion}` : def.bgImage;
        gridEl.style.backgroundImage = `url('${bgUrl}')`;

        // Update hint bar
        hintName.textContent  = def.name;
        hintStage.textContent = stageKey;
        hintBg.textContent    = def.bgImage.split('/').pop();

        // Re-render grid with this level's data
        renderAll();
        renderPlatforms();
        updatePlatformPanel();
    }

    // Wire tab buttons
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => switchTab(parseInt(btn.dataset.stage)));
    });

    // ── Paint ──────────────────────────────────────────────────────────────────
    let labelRefreshScheduled = false;
    function scheduleLabelRefresh() {
        if (labelRefreshScheduled) return;
        labelRefreshScheduled = true;
        requestAnimationFrame(() => { labelRefreshScheduled = false; refreshLabels(); });
    }

    function handleCellMouseDown(x, y, cellEl) {
        if (isPlatformEditingActive()) {
            collisionPaintValue = !platformCollisionHasCell(x, y);
            paintPlatformCollision(x, y, collisionPaintValue);
        } else {
            paint(x, y, cellEl);
        }
    }

    function handleCellMouseOver(x, y, cellEl) {
        if (isPlatformEditingActive()) {
            paintPlatformCollision(x, y, collisionPaintValue);
        } else {
            paint(x, y, cellEl);
        }
    }

    function paint(x, y, cellEl) {
        const mapData = getMapData();
        const isEntity = ![ ' ', '#', '=', 'X' ].includes(currentChar);
        if (isEntity) {
            for (let dy = -2; dy <= 3; dy++) {
                for (let dx = -2; dx <= 3; dx++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        mapData[ny][nx] = currentChar;
                        renderCell(cellEls[ny * COLS + nx], currentChar);
                    }
                }
            }
        } else {
            mapData[y][x] = currentChar;
            renderCell(cellEl, currentChar);
        }
        scheduleLabelRefresh();
    }

    function selectedPlatform() {
        const platforms = getPlatformData();
        if (selectedPlatformIndex < 0 || selectedPlatformIndex >= platforms.length) return null;
        return normalizePlatform(platforms[selectedPlatformIndex]);
    }

    function getPlatformScale(platform) {
        const scale = Number.isFinite(platform.scale_x) ? platform.scale_x : platform.scale_y;
        return Number.isFinite(scale) ? scale : 1;
    }

    function setPlatformScale(platform, scale) {
        platform.scale_x = scale;
        platform.scale_y = scale;
    }

    function worldToSelectedPlatformCell(worldX, worldY) {
        const platform = selectedPlatform();
        if (!platform) return null;
        const texture = platformTextureFor(platform);
        const scale = getPlatformScale(platform);
        if (scale === 0) return null;
        const collisionWidth = platformCollisionWidth(texture);
        const collisionHeight = platformCollisionHeight(texture);
        const localX = (worldX - platform.x) / scale + collisionWidth / 2;
        const localY = (worldY - platform.y) / scale + collisionHeight / 2;
        if (localX < 0 || localX >= collisionWidth || localY < 0 || localY >= collisionHeight) return null;
        return {
            x: Math.floor(localX / PLATFORM_CELL_SIZE),
            y: Math.floor(localY / PLATFORM_CELL_SIZE),
        };
    }

    function platformCollisionHasCell(gridX, gridY) {
        const cell = worldToSelectedPlatformCell((gridX + 0.5) * 10, (gridY + 0.5) * 10);
        const platform = selectedPlatform();
        if (!cell || !platform) return false;
        return platform.collision_cells.some(c => c.x === cell.x && c.y === cell.y);
    }

    function paintPlatformCollision(gridX, gridY, shouldAdd) {
        const cell = worldToSelectedPlatformCell((gridX + 0.5) * 10, (gridY + 0.5) * 10);
        const platform = selectedPlatform();
        if (!cell || !platform) return;
        const idx = platform.collision_cells.findIndex(c => c.x === cell.x && c.y === cell.y);
        if (shouldAdd && idx < 0) platform.collision_cells.push(cell);
        if (!shouldAdd && idx >= 0) platform.collision_cells.splice(idx, 1);
        renderPlatforms();
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function renderCell(cellEl, char) {
        cellEl.style.backgroundColor = colorMap[char] || colorMap[' '];
        cellEl.removeAttribute('data-label');
        cellEl.classList.remove('has-label');
    }

    function renderAll() {
        const mapData = getMapData();
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                renderCell(cellEls[y * COLS + x], mapData[y][x]);
            }
        }
        refreshLabels();
    }

    function renderPlatforms() {
        platformLayer.innerHTML = '';
        const platforms = getPlatformData();
        platformLayer.style.display = 'block';
        if (platforms.length === 0) {
            return;
        }
        platforms.forEach((platform, index) => {
            normalizePlatform(platform);
            const scale = getPlatformScale(platform);
            const texture = platformTextureFor(platform);
            const moveLeft = Number.isFinite(platform.move_left) ? platform.move_left : 0;
            const moveRight = Number.isFinite(platform.move_right) ? platform.move_right : 0;
            const moveUp = Number.isFinite(platform.move_up) ? platform.move_up : 0;
            const moveDown = Number.isFinite(platform.move_down) ? platform.move_down : 0;
            if (moveLeft > 0 || moveRight > 0) {
                const range = document.createElement('div');
                range.className = 'platform-move-range';
                range.style.left = ((platform.x - moveLeft) / 1920 * 100) + '%';
                range.style.top = (platform.y / 1080 * 100) + '%';
                range.style.width = ((moveLeft + moveRight) / 1920 * 100) + '%';
                platformLayer.appendChild(range);
            }
            if (moveUp > 0 || moveDown > 0) {
                const range = document.createElement('div');
                range.className = 'platform-move-range vertical';
                range.style.left = (platform.x / 1920 * 100) + '%';
                range.style.top = ((platform.y - moveUp) / 1080 * 100) + '%';
                range.style.height = ((moveUp + moveDown) / 1080 * 100) + '%';
                platformLayer.appendChild(range);
            }

            const el = document.createElement('div');
            el.className = 'platform-object' + (index === selectedPlatformIndex ? '' : ' inactive');
            el.style.backgroundImage = `url('${texture.editorUrl}')`;
            el.style.left = ((platform.x - texture.width * scale / 2) / 1920 * 100) + '%';
            el.style.top = ((platform.y - texture.height * scale / 2) / 1080 * 100) + '%';
            el.style.width = (texture.width * scale / 1920 * 100) + '%';
            el.style.height = (texture.height * scale / 1080 * 100) + '%';
            el.style.pointerEvents = platformMode === 'select' ? 'auto' : 'none';
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                selectedPlatformIndex = index;
                updatePlatformPanel();
                renderPlatforms();
            });
            platformLayer.appendChild(el);

            if (index === selectedPlatformIndex) {
                for (const c of platform.collision_cells) {
                    const cell = document.createElement('div');
                    cell.className = 'platform-collision-cell';
                    const worldLeft = platform.x + (c.x * PLATFORM_CELL_SIZE - platformCollisionWidth(texture) / 2) * scale;
                    const worldTop = platform.y + (c.y * PLATFORM_CELL_SIZE - platformCollisionHeight(texture) / 2) * scale;
                    cell.style.left = (worldLeft / 1920 * 100) + '%';
                    cell.style.top = (worldTop / 1080 * 100) + '%';
                    cell.style.width = (PLATFORM_CELL_SIZE * scale / 1920 * 100) + '%';
                    cell.style.height = (PLATFORM_CELL_SIZE * scale / 1080 * 100) + '%';
                    platformLayer.appendChild(cell);
                }
            }
        });
    }

    function updatePlatformPanel() {
        platformPanel.classList.add('visible');
        const platform = selectedPlatform();
        const disabled = !platform;
        for (const input of Object.values(platformInputs)) input.disabled = disabled;
        document.getElementById('btn-delete-platform').disabled = disabled;
        if (!platform) return;
        platformInputs.x.value = platform.x;
        platformInputs.y.value = platform.y;
        platformInputs.scale.value = getPlatformScale(platform);
        platformInputs.move_left.value = Number.isFinite(platform.move_left) ? platform.move_left : 0;
        platformInputs.move_right.value = Number.isFinite(platform.move_right) ? platform.move_right : 0;
        platformInputs.move_up.value = Number.isFinite(platform.move_up) ? platform.move_up : 0;
        platformInputs.move_down.value = Number.isFinite(platform.move_down) ? platform.move_down : 0;
        platformInputs.speed.value = platform.speed;
    }

    function setPlatformMode(mode) {
        platformMode = mode;
        document.getElementById('btn-platform-select').classList.toggle('active', mode === 'select');
        document.getElementById('btn-platform-collision').classList.toggle('active', mode === 'collision');
        platformLayer.style.pointerEvents = 'none';
        gridEl.style.cursor = isPlatformEditingActive() ? 'cell' : (['#', '=', 'X'].includes(currentChar) ? 'none' : 'crosshair');
        renderPlatforms();
    }

    function refreshLabels() {
        const mapData = getMapData();
        const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (visited[y][x]) continue;
                const ch = mapData[y][x];
                if (!ENTITY_CHARS.has(ch)) { visited[y][x] = true; continue; }
                const stack = [[x, y]];
                let minX = x, maxX = x, minY = y, maxY = y;
                while (stack.length > 0) {
                    const [cx, cy] = stack.pop();
                    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) continue;
                    if (visited[cy][cx]) continue;
                    if (mapData[cy][cx] !== ch) continue;
                    visited[cy][cx] = true;
                    if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
                    if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
                    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
                }
                const cx = Math.floor((minX + maxX) / 2);
                const cy = Math.floor((minY + maxY) / 2);
                const c = cellEls[cy * COLS + cx];
                if (c) { c.setAttribute('data-label', nameMap[ch]); c.classList.add('has-label'); }
            }
        }
    }

    // ── Export (ALL levels → complete level_data.gd) ───────────────────────────
    // Persistent handle to scripts/level_data.gd, granted once per tab via the
    // File System Access API. Subsequent saves write straight through without
    // any extra prompts.
    let levelDataFileHandle = null;
    const supportsFsAccess = typeof window.showSaveFilePicker === 'function';

    function buildLevelDataText() {
        const stageKeys = Object.keys(LEVEL_DEFS).map(Number).sort((a, b) => a - b);
        const out = [];
        out.push('extends Node');
        out.push('');
        out.push('const LEVELS := {');
        for (const stageKey of stageKeys) {
            const mapData = allMapData[stageKey];
            out.push('\t' + stageKey + ': [');
            for (let y = 0; y < ROWS; y++) {
                out.push('\t\t"' + mapData[y].join('') + '",');
            }
            out.push('\t],');
        }
        out.push('}');
        out.push('');
        out.push('const TILE_SOURCES := {"#": 0, ".": 1, "=": 2}');
        out.push('const PICKUP_TYPES := {"r": 2}');
        out.push('');
        out.push('const FLOATING_PLATFORMS := {');
        for (const stageKey of stageKeys) {
            out.push('\t' + stageKey + ': [');
            for (const platform of allPlatformData[stageKey]) {
                out.push('\t\t{');
                out.push('\t\t\t"texture_path": "' + (platform.texture_path || DEFAULT_PLATFORM_TEXTURE_PATH) + '",');
                out.push('\t\t\t"position": Vector2(' + platform.x + ', ' + platform.y + '),');
                const scale = getPlatformScale(platform);
                out.push('\t\t\t"scale": Vector2(' + scale + ', ' + scale + '),');
                out.push('\t\t\t"move_left": ' + (Number.isFinite(platform.move_left) ? platform.move_left : 0) + ',');
                out.push('\t\t\t"move_right": ' + (Number.isFinite(platform.move_right) ? platform.move_right : 0) + ',');
                out.push('\t\t\t"move_up": ' + (Number.isFinite(platform.move_up) ? platform.move_up : 0) + ',');
                out.push('\t\t\t"move_down": ' + (Number.isFinite(platform.move_down) ? platform.move_down : 0) + ',');
                out.push('\t\t\t"speed": ' + platform.speed + ',');
                out.push('\t\t\t"collision_cells": [');
                const sortedCells = platform.collision_cells.slice().sort((a, b) => a.y - b.y || a.x - b.x);
                const cellLines = [];
                for (let i = 0; i < sortedCells.length; i += 12) {
                    cellLines.push(sortedCells.slice(i, i + 12).map(c => 'Vector2i(' + c.x + ', ' + c.y + ')').join(', '));
                }
                for (const line of cellLines) out.push('\t\t\t\t' + line + ',');
                out.push('\t\t\t],');
                out.push('\t\t},');
            }
            out.push('\t],');
        }
        out.push('}');
        out.push('');
        return out.join('\n');
    }

    async function writeViaFsAccess(text) {
        // First click in this tab: ask user to point us at level_data.gd.
        // Browser remembers the permission for the remainder of the session.
        if (!levelDataFileHandle) {
            levelDataFileHandle = await window.showSaveFilePicker({
                suggestedName: 'level_data.gd',
                types: [{
                    description: 'Godot script',
                    accept: { 'text/plain': ['.gd'] },
                }],
            });
        }
        // Verify we still have write permission (some browsers re-prompt).
        if (typeof levelDataFileHandle.queryPermission === 'function') {
            const opts = { mode: 'readwrite' };
            let perm = await levelDataFileHandle.queryPermission(opts);
            if (perm !== 'granted') perm = await levelDataFileHandle.requestPermission(opts);
            if (perm !== 'granted') throw new Error('write permission denied');
        }
        const writable = await levelDataFileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        return levelDataFileHandle.name || 'level_data.gd';
    }

    function downloadAsFallback(text) {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = 'level_data.gd';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('btn-export').addEventListener('click', async () => {
        const text = buildLevelDataText();
        ioText.value = text;
        const stageCount = Object.keys(LEVEL_DEFS).length;

        if (supportsFsAccess) {
            try {
                const name = await writeViaFsAccess(text);
                alert('已直接写入「' + name + '」（含全部 ' + stageCount + ' 个关卡）。\n本标签页后续导出会自动覆盖同一文件，无需再次选择。');
                return;
            } catch (e) {
                if (e && e.name === 'AbortError') return;   // user cancelled the picker
                console.warn('[export] File System Access failed, falling back to download:', e);
                // fall through to download fallback
            }
        }

        // Fallback path (Safari / Firefox / permission denied).
        downloadAsFallback(text);
        ioText.select();
        try { document.execCommand('copy'); } catch (e) {}
        alert('当前浏览器不支持直接写入本地文件，已改为下载 level_data.gd 到默认下载目录，并把内容复制到剪贴板。\n请把它替换到 scripts/level_data.gd。');
    });

    // ── Import Single Tab (lines with double-quotes → current tab only) ────────
    document.getElementById('btn-import').addEventListener('click', () => {
        const parsed = parseCurrentStageRows(ioText.value);
        if (parsed.length === 0) {
            alert('未找到有效的地图字符串！请确保粘贴的是带双引号的行。');
            return;
        }
        applyMapRowsToStage(activeStage, parsed);
        importFloatingPlatformsForStageFromText(ioText.value, activeStage);
        refreshActiveStageView();
        alert('已导入到「' + LEVEL_DEFS[activeStage].name + '」（Stage ' + activeStage + '）。其他关卡数据不受影响。');
    });

    function importAllLevelsFromText(text) {
        const levelsText = extractLevelsDictText(text) || text;
        let matched = 0;
        const importedNames = [];
        const importedStats = [];
        for (const stageKeyText of Object.keys(LEVEL_DEFS)) {
            const stageKey = parseInt(stageKeyText);
            const blockText = extractStageArrayText(levelsText, stageKey);
            if (!blockText) continue;
            const parsed = parseMapRowsFromText(blockText);
            if (parsed.length === 0) continue;
            applyMapRowsToStage(stageKey, parsed);
            matched++;
            importedNames.push(LEVEL_DEFS[stageKey].name);
            importedStats.push({ stageKey, rows: parsed.length });
        }
        importFloatingPlatformsFromText(text);
        if (matched === 0) {
            alert('未找到任何关卡数据块。请粘贴完整的 level_data.gd 文件内容。');
            return false;
        }
        refreshActiveStageView();
        const statText = importedStats.map(s => {
            const name = LEVEL_DEFS[s.stageKey].name;
            const platformCount = (allPlatformData[s.stageKey] || []).length;
            return name + ': ' + s.rows + ' 行 / ' + platformCount + ' 平台';
        }).join('；');
        alert('已从完整文件导入 ' + matched + ' 个关卡（' + importedNames.join('、') + '）。\n' + statText + '\n当前显示「' + LEVEL_DEFS[activeStage].name + '」。');
        return true;
    }

    function refreshActiveStageView() {
        selectedPlatformIndex = 0;
        renderAll();
        renderPlatforms();
        updatePlatformPanel();
    }

    function isMapRowString(value) {
        return value.length >= 32 && /^[ #.=XPMRDZBr]+$/.test(value.replace(/[GS]/g, ' '));
    }

    function parseCurrentStageRows(text) {
        const stageRows = parseStageRowsFromText(text, activeStage);
        if (stageRows) return stageRows;
        return parseMapRowsFromText(text);
    }

    function parseStageRowsFromText(text, stageKey) {
        const levelsText = extractLevelsDictText(text);
        if (!levelsText) return null;
        const stageText = extractStageArrayText(levelsText, stageKey);
        if (!stageText) return [];
        return parseMapRowsFromText(stageText);
    }

    function parseMapRowsFromText(text) {
        const parsed = [];
        const lineRe = /"([^"]*)"/g;
        let m;
        while ((m = lineRe.exec(text)) !== null) {
            // 导入时静默清除已废弃字符（a/c/h 拾取物、G/S 旧敌人）
            if (isMapRowString(m[1])) parsed.push(m[1].replace(/[achGS]/g, ' '));
        }
        return parsed;
    }

    function applyMapRowsToStage(stageKey, parsed) {
        const mapData = allMapData[stageKey];
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                mapData[y][x] = (y < parsed.length && x < parsed[y].length) ? parsed[y][x] : ' ';
            }
        }
    }

    function extractLevelsDictText(text) {
        const levelsIndex = text.indexOf('const LEVELS');
        const levelsStart = levelsIndex >= 0 ? text.indexOf('{', levelsIndex) : -1;
        return levelsStart >= 0 ? extractBalancedBlock(text, levelsStart, '{', '}') : null;
    }

    function extractStageArrayText(dictText, stageKey) {
        const keyRe = new RegExp('(^|\\n)\\s*' + stageKey + '\\s*:\\s*\\[', 'm');
        const m = keyRe.exec(dictText);
        if (!m) return '';
        const arrayStart = dictText.indexOf('[', m.index);
        return arrayStart >= 0 ? extractBalancedBlock(dictText, arrayStart, '[', ']') : '';
    }

    function extractBalancedBlock(text, startIndex, openChar, closeChar) {
        let depth = 0;
        let inString = false;
        for (let i = startIndex; i < text.length; i++) {
            const ch = text[i];
            const prev = i > 0 ? text[i - 1] : '';
            if (ch === '"' && prev !== '\\') inString = !inString;
            if (inString) continue;
            if (ch === openChar) depth++;
            if (ch === closeChar) {
                depth--;
                if (depth === 0) return text.slice(startIndex, i + 1);
            }
        }
        return '';
    }

    function splitTopLevelObjects(arrayText) {
        const objects = [];
        let depth = 0;
        let start = -1;
        let inString = false;
        for (let i = 0; i < arrayText.length; i++) {
            const ch = arrayText[i];
            const prev = i > 0 ? arrayText[i - 1] : '';
            if (ch === '"' && prev !== '\\') inString = !inString;
            if (inString) continue;
            if (ch === '{') {
                if (depth === 0) start = i;
                depth++;
            } else if (ch === '}') {
                depth--;
                if (depth === 0 && start >= 0) objects.push(arrayText.slice(start, i + 1));
            }
        }
        return objects;
    }

    function parsePlatformsArray(arrayText) {
        const platforms = [];
        for (const obj of splitTopLevelObjects(arrayText)) {
            const texturePath = obj.match(/"texture_path"\s*:\s*"([^"]+)"/);
            const pos = obj.match(/"position"\s*:\s*Vector2\(\s*([-.\d]+)\s*,\s*([-.\d]+)\s*\)/);
            const scl = obj.match(/"scale"\s*:\s*Vector2\(\s*([-.\d]+)\s*,\s*([-.\d]+)\s*\)/);
            const left = obj.match(/"move_left"\s*:\s*([-.\d]+)/);
            const right = obj.match(/"move_right"\s*:\s*([-.\d]+)/);
            const up = obj.match(/"move_up"\s*:\s*([-.\d]+)/);
            const down = obj.match(/"move_down"\s*:\s*([-.\d]+)/);
            const speed = obj.match(/"speed"\s*:\s*([-.\d]+)/);
            const cells = [];
            const cellRe = /Vector2i\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)/g;
            let cm;
            while ((cm = cellRe.exec(obj)) !== null) {
                cells.push({ x: parseInt(cm[1]), y: parseInt(cm[2]) });
            }
            const scale = scl ? parseFloat(scl[1]) : 1;
            platforms.push({
                texture_path: texturePath ? texturePath[1] : DEFAULT_PLATFORM_TEXTURE_PATH,
                x: pos ? parseFloat(pos[1]) : 960,
                y: pos ? parseFloat(pos[2]) : 430,
                scale_x: scale,
                scale_y: scale,
                move_left: left ? parseFloat(left[1]) : 0,
                move_right: right ? parseFloat(right[1]) : 0,
                move_up: up ? parseFloat(up[1]) : 0,
                move_down: down ? parseFloat(down[1]) : 0,
                speed: speed ? parseFloat(speed[1]) : 80,
                collision_cells: cells.length > 0 ? cells : createDefaultPlatformCollision(),
            });
        }
        return platforms;
    }

    function importFloatingPlatformsFromText(text) {
        for (const stageKey of Object.keys(LEVEL_DEFS)) {
            importFloatingPlatformsForStageFromText(text, parseInt(stageKey));
        }
        selectedPlatformIndex = 0;
    }

    function importFloatingPlatformsForStageFromText(text, stageKey) {
        const constIndex = text.indexOf('const FLOATING_PLATFORMS');
        if (constIndex < 0) return;
        const dictStart = text.indexOf('{', constIndex);
        if (dictStart < 0) return;
        const dictText = extractBalancedBlock(text, dictStart, '{', '}');
        if (!dictText) return;
        const arrayText = extractStageArrayText(dictText, stageKey);
        if (!arrayText) return;
        allPlatformData[stageKey] = parsePlatformsArray(arrayText);
    }

    // ── Import All (full level_data.gd → each stage block → correct tab) ──────
    // Three input sources, tried in order:
    //   1. Whatever is already pasted into the textarea.
    //   2. fetch('scripts/level_data.gd') – works when served via http(s)://.
    //   3. Native file picker – the only option that works under file:// because
    //      browsers block fetch() of local files for security.
    const filePicker = document.getElementById('file-picker');

    function handleImportAllText(text) {
        ioText.value = text;
        importAllLevelsFromText(text);
    }

    filePicker.addEventListener('change', () => {
        const file = filePicker.files && filePicker.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => handleImportAllText(String(reader.result || ''));
        reader.onerror = () => alert('读取文件失败：' + reader.error);
        reader.readAsText(file);
        // Reset so picking the same file again still fires "change".
        filePicker.value = '';
    });

    document.getElementById('btn-import-all').addEventListener('click', async () => {
        const pasted = ioText.value;
        if (pasted.trim().length > 0) {
            importAllLevelsFromText(pasted);
            return;
        }
        // Under file://, browsers block fetch() of local files. Open the picker
        // synchronously while the user's click gesture is still active.
        if (window.location.protocol === 'file:') {
            filePicker.click();
            return;
        }
        // Try to auto-load from disk via fetch (works under http://).
        try {
            const response = await fetch('scripts/level_data.gd', { cache: 'no-store' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const text = await response.text();
            handleImportAllText(text);
            return;
        } catch (e) {
            // fetch fails under file:// – fall through to native picker.
            console.warn('[import-all] fetch failed, falling back to file picker:', e);
        }
        // Open native file dialog as fallback.
        filePicker.style.display = 'block';
        alert('无法自动读取 scripts/level_data.gd。请使用下方文件选择框手动选择 level_data.gd。');
    });

    // ── Clear Current Tab ──────────────────────────────────────────────────────
    document.getElementById('btn-clear').addEventListener('click', () => {
        const name = LEVEL_DEFS[activeStage].name;
        if (!confirm('确定要清空「' + name + '」（Stage ' + activeStage + '）的地图吗？其他关卡数据不受影响。')) return;
        allMapData[activeStage] = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
        allPlatformData[activeStage] = [];
        selectedPlatformIndex = 0;
        renderAll();
        renderPlatforms();
        updatePlatformPanel();
    });

    // ── Clear All Tabs ─────────────────────────────────────────────────────────
    document.getElementById('btn-clear-all').addEventListener('click', () => {
        const names = Object.keys(LEVEL_DEFS).map(k => LEVEL_DEFS[k].name).join('、');
        if (!confirm('确定要一键清空所有关卡地图吗？\n将清空：' + names + '。')) return;
        for (const stageKey of Object.keys(LEVEL_DEFS)) {
            allMapData[stageKey] = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
            allPlatformData[stageKey] = [];
        }
        selectedPlatformIndex = 0;
        renderAll();
        renderPlatforms();
        updatePlatformPanel();
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    // Set initial background and render
    switchTab(1);
    setPlatformMode('select');

</script>
</body>
</html>
