# Build the Godot 4 Web export and deploy it to GitHub Pages.
#
# Triggered on every push to main. The job:
#   1. Downloads Godot 4.6.2-stable (Linux headless) + matching Web export templates
#   2. Imports project assets (`godot --import`)
#   3. Exports the "Web" preset (defined in export_presets.cfg) to `build/web/`
#   4. Patches index.html if missing (defensive)
#   5. Uploads `build/web/` as a Pages artifact and deploys
#
# After this workflow's first successful run, the game is live at:
#   https://<your-username>.github.io/<repo-name>/

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to push to gh-pages via the Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys racing each other; latest push wins
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  GODOT_STATUS: stable
  EXPORT_NAME: Web
  EXPORT_DIR: build/web

jobs:
  build:
    name: Build Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
        run: |
          set -e
          GODOT_BIN="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          GODOT_ZIP="${GODOT_BIN}.zip"
          TPL_ZIP="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"

          echo "Downloading Godot binary..."
          curl -L -o "$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${GODOT_ZIP}"
          unzip -q "$GODOT_ZIP"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          echo "Downloading Godot export templates..."
          curl -L -o "$TPL_ZIP" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${TPL_ZIP}"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q "$TPL_ZIP"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Import project assets
        # First run materializes .godot/imported/. --quit-after 2 keeps Godot from staying open after assets settle.
        run: |
          set -e
          mkdir -p "${EXPORT_DIR}"
          godot --headless --path . --import || true
          # Re-run quiet to ensure all imports stabilize (textures, scenes, scripts)
          godot --headless --path . --quit-after 2 || true

      - name: Export Web build
        run: |
          set -e
          godot --headless --path . --export-release "${EXPORT_NAME}" "${EXPORT_DIR}/index.html"
          ls -la "${EXPORT_DIR}"

      - name: Cache-bust web assets (version by commit SHA)
        # 背景：Godot 的 web 导出用固定文件名（index.pck / index.wasm / index.js ...）。
        # GitHub Pages + 浏览器会长期缓存这些静态资源，导致老玩家即使我们重新部署了
        # 修复版，浏览器仍加载缓存里的旧 index.pck，运行旧代码（典型表现：鬼球击杀
        # 敌人不掉落铜钱/元宝等已修复的 Bug 在线上"复活"）。
        #
        # 解决：给所有 index.* 资源文件名追加本次提交的短 SHA，使每次部署的资源 URL
        # 都唯一变化，强制所有浏览器拉取全新资源，彻底绕过旧缓存。index.html 本身不
        # 改名（GitHub Pages 对 html 用协商缓存，会及时拿到最新版），仅在其中同步改写
        # 对 index.js / executable 基名 / fileSizes 键名的引用。
        run: |
          set -e
          VER="${GITHUB_SHA::8}"
          cd "${EXPORT_DIR}"

          # 1) 重命名除 index.html 外的所有 index.* 资源：index.<rest> -> index-<VER>.<rest>
          for f in index.*; do
            [ "$f" = "index.html" ] && continue
            rest="${f#index.}"
            mv "$f" "index-${VER}.${rest}"
          done

          # 2) 改写 index.html 中对资源的所有引用，使其指向重命名后的带版本文件：
          #    - 资源引用形如 href="index.icon.png" / src="index.js" / src="index.png"
          #      / "index.pck" / "index.wasm"，统一把 `index.<rest>` 改成 `index-<VER>.<rest>`
          #    - GODOT_CONFIG 的 "executable":"index" 改成 "index-<VER>"，loader 据此在运行时
          #      拼接 .pck/.wasm/.audio.worklet.js 等资源 URL
          # 注意：index.html 自身不会在文件内自引用，故不会被误伤。
          sed -i \
            -e "s#\(href=\"\)index\.#\1index-${VER}.#g" \
            -e "s#\(src=\"\)index\.#\1index-${VER}.#g" \
            -e "s#\"executable\":\"index\"#\"executable\":\"index-${VER}\"#g" \
            -e "s#\"index\.pck\"#\"index-${VER}.pck\"#g" \
            -e "s#\"index\.wasm\"#\"index-${VER}.wasm\"#g" \
            index.html

          echo "=== cache-busted to version ${VER} ==="
          ls -la

      - name: Add .nojekyll
        # Prevents GitHub Pages' Jekyll from filtering out files starting with `_`
        # (Godot's web build doesn't ship any, but this is defensive + standard practice)
        run: touch "${EXPORT_DIR}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Godot web artifacts can take longer than the default 10 minutes to
          # finalize on Pages when GitHub is slow. Keep waiting instead of
          # failing a completed build during the deploy poll.
          timeout: 1200000
          reporting_interval: 10000
